name: Build iBoot64Patcher
# This workflow delegates all build logic to build.sh.
# To build locally: ./build.sh [install_prefix]

on:
  workflow_dispatch:

jobs:
  # ── Linux build ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILDROOT: "buildroot_ubuntu-latest"

    steps:
      - uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build
        run: ./build.sh "$GITHUB_WORKSPACE/$BUILDROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILDROOT }}
          path: ${{ env.BUILDROOT }}


  # ── macOS universal binary build ────────────────────────────────────────────
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (arm64 native)
            artifact: buildroot_macos-15-arm64
          - runner: macos-15-intel    # x86_64 native
            artifact: buildroot_macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      BUILDROOT: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build
        run: ./build.sh "$GITHUB_WORKSPACE/$BUILDROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILDROOT }}
          path: ${{ env.BUILDROOT }}


