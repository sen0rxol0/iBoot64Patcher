name: Build iBoot64Patcher

on:
  workflow_dispatch:

jobs:
  # ── Linux build ─────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    env:
      BUILDROOT: "buildroot_ubuntu-latest"
      GIT_DEPENDENCIES: tihmstar/libgeneral,tihmstar/libinsn,tihmstar/libplist,tihmstar/img3tool,tihmstar/img4tool,tihmstar/libpatchfinder

    steps:
      - uses: actions/checkout@v4

      - name: Prepare buildroot
        run: mkdir -p $BUILDROOT

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            libssl-dev libcurl4-openssl-dev libzip-dev

      - name: Build libplist (static, fPIC)
        run: |
          git clone https://github.com/libimobiledevice/libplist libplist
          cd libplist
          ./autogen.sh --without-cython --enable-static --disable-shared \
            CFLAGS="-fPIC" CXXFLAGS="-fPIC"
          make -j$(nproc)
          sudo make install
          cd ..
          rm -rf libplist

      - name: Build lzfse (static, fPIC)
        run: |
          git clone https://github.com/lzfse/lzfse.git
          make -C lzfse CFLAGS="-fPIC" -j$(nproc)
          make -C lzfse INSTALL_PREFIX=$GITHUB_WORKSPACE/$BUILDROOT/usr/local install
          sudo make -C lzfse install INSTALL_PREFIX=/usr/local
          rm -rf lzfse

      - name: Install cctools headers
        run: |
          wget -q https://github.com/apple-oss-distributions/cctools/archive/refs/tags/cctools-973.0.1.tar.gz -O cctools.tar.gz
          mkdir -p tmp/cctools
          tar -xzf cctools.tar.gz -C tmp --strip-components=1
          sed -i 's_#include_//_g' tmp/include/mach-o/loader.h
          sed -i -e 's=<stdint.h>=\n#include <stdint.h>\ntypedef int integer_t;\ntypedef integer_t cpu_type_t;\ntypedef integer_t cpu_subtype_t;\ntypedef integer_t cpu_threadtype_t;\ntypedef int vm_prot_t;=g' \
            tmp/include/mach-o/loader.h
          sudo cp -r tmp/include/* /usr/local/include/
          rm -rf tmp cctools.tar.gz

      - name: Build git dependencies
        run: |
          mkdir depdir && cd depdir
          IFS=',' read -r -a deps <<< "$GIT_DEPENDENCIES"
          for d in "${deps[@]}"; do
            r=$(echo "$d" | cut -d'/' -f2)
            echo "Building dependency: $r"
            git clone "https://github.com/$d.git" "$r"
            cd "$r"
            ./autogen.sh --enable-static --disable-shared
            make -j$(nproc)
            sudo make install
            cd ..
            rm -rf "$r"
          done
          cd .. && rm -rf depdir

      - name: autogen
        run: ./autogen.sh --enable-static --disable-shared

      - name: make
        run: make -j$(nproc)

      - name: make install
        run: make DESTDIR=$GITHUB_WORKSPACE/$BUILDROOT install

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILDROOT }}
          path: ${{ env.BUILDROOT }}


  # ── macOS universal binary build ────────────────────────────────────────────
  # Runs on the two supported runner pairs:
  #   macos-15        → Apple Silicon host  (arm64-native, cross-compiles x86_64)
  #   macos-15-intel  → x86_64 host         (cross-compiles arm64)
  # Both produce a fat universal binary via lipo.
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (arm64 native)
            artifact: buildroot_macos-15-arm64
          - runner: macos-15-intel    # x86_64 native
            artifact: buildroot_macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      BUILDROOT: ${{ matrix.artifact }}
      GIT_DEPENDENCIES: tihmstar/libgeneral,tihmstar/libinsn,tihmstar/libplist,tihmstar/img3tool,tihmstar/img4tool,tihmstar/libpatchfinder
      MAC_DYNAMIC_LIBS: openssl
      MACOSX_DEPLOYMENT_TARGET: "10.5"

    steps:
      - uses: actions/checkout@v4

      - name: Prepare buildroot
        run: mkdir -p $BUILDROOT

      - name: Install Homebrew dependencies
        run: |
          brew install autoconf automake libtool pkg-config libzip libplist
          brew reinstall openssl

          # Ensure openssl pkg-config is discoverable
          if [ ! -e /usr/local/lib/pkgconfig/openssl.pc ]; then
            sudo mkdir -p /usr/local/lib/pkgconfig/
            sudo cp -r "$(brew --prefix openssl)/lib/pkgconfig/"* /usr/local/lib/pkgconfig/
          fi

      # ── Build each git dependency as a universal static lib ────────────────
      - name: Build git dependencies (universal)
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          ARCHES=("arm64" "x86_64")
          WORKDIR="$(mktemp -d)"

          mkdir -p depdir
          IFS=',' read -r -a deps <<< "$GIT_DEPENDENCIES"

          for d in "${deps[@]}"; do
            r=$(echo "$d" | cut -d'/' -f2)
            echo "==== Building universal: $r ===="
            git clone "https://github.com/$d.git" "depdir/$r"

            for arch in "${ARCHES[@]}"; do
              SLICE_PREFIX="$WORKDIR/${r}_${arch}/usr/local"
              mkdir -p "$SLICE_PREFIX"
              SRC="$WORKDIR/${r}_${arch}/src"
              cp -r "depdir/$r" "$SRC"
              cd "$SRC"
              ./autogen.sh \
                --enable-static --disable-shared \
                --prefix="$SLICE_PREFIX" \
                --host="${arch}-apple-darwin" \
                CFLAGS="-arch $arch -isysroot $SDK -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
                CXXFLAGS="-arch $arch -isysroot $SDK -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
                LDFLAGS="-arch $arch"
              make -j$(sysctl -n hw.logicalcpu)
              make install
              cd "$GITHUB_WORKSPACE"
            done

            # lipo arm64 + x86_64 static libs into fat universals
            ARM_LIB_DIR="$WORKDIR/${r}_arm64/usr/local/lib"
            X86_LIB_DIR="$WORKDIR/${r}_x86_64/usr/local/lib"
            ARM_INC_DIR="$WORKDIR/${r}_arm64/usr/local/include"

            if [ -d "$ARM_LIB_DIR" ]; then
              find "$ARM_LIB_DIR" -name "*.a" | while read arm_lib; do
                libname="$(basename "$arm_lib")"
                x86_lib="$X86_LIB_DIR/$libname"
                if [ -f "$x86_lib" ]; then
                  sudo mkdir -p /usr/local/lib
                  sudo lipo -create "$arm_lib" "$x86_lib" -output "/usr/local/lib/$libname"
                  echo "  lipo'd: $libname"
                fi
              done
            fi

            # Install headers (arch-independent, use arm64 build)
            if [ -d "$ARM_INC_DIR" ]; then
              sudo cp -r "$ARM_INC_DIR/"* /usr/local/include/
            fi

            rm -rf "depdir/$r"
          done
          rm -rf depdir "$WORKDIR"

      # ── Build iBoot64Patcher as a universal binary ──────────────────────────
      - name: Build universal binary (arm64 + x86_64)
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          ARCHES=("arm64" "x86_64")
          WORKDIR="$(mktemp -d)"

          # Hide dylibs to force static linking
          echo "Hiding dynamic libs: $MAC_DYNAMIC_LIBS"
          IFS=',' read -r -a dynlibs <<< "$MAC_DYNAMIC_LIBS"
          for lib in "${dynlibs[@]}"; do
            find "$(brew --prefix "$lib")" -name "*.dylib" -exec mv {} {}.bak \;
          done

          SLICE_BINS=()
          for arch in "${ARCHES[@]}"; do
            echo "==== Compiling $arch slice ===="
            SRC="$WORKDIR/src_${arch}"
            cp -r "$GITHUB_WORKSPACE" "$SRC"
            cd "$SRC"
            ./autogen.sh \
              --enable-static --disable-shared \
              CFLAGS="-arch $arch -isysroot $SDK -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              CXXFLAGS="-arch $arch -isysroot $SDK -mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET" \
              LDFLAGS="-arch $arch"
            make -j$(sysctl -n hw.logicalcpu)
            # Collect the built binary (first executable found)
            BIN="$(find . -maxdepth 4 -type f -perm +111 ! -name '*.sh' ! -name '*.py' | grep -v '\.o$' | head -1)"
            SLICE_BINS+=("$(pwd)/$BIN")
            cd "$GITHUB_WORKSPACE"
          done

          # Restore dylibs
          echo "Restoring dynamic libs..."
          for lib in "${dynlibs[@]}"; do
            find "$(brew --prefix "$lib")" -name "*.dylib.bak" | while read f; do
              mv "$f" "${f%.bak}"
            done
          done

          # lipo slices into a fat universal
          BIN_NAME="$(basename "${SLICE_BINS[0]}")"
          DEST="$GITHUB_WORKSPACE/$BUILDROOT/usr/local/bin"
          mkdir -p "$DEST"
          lipo -create "${SLICE_BINS[@]}" -output "$DEST/$BIN_NAME"
          echo "Universal binary created: $DEST/$BIN_NAME"
          lipo -info "$DEST/$BIN_NAME"

          rm -rf "$WORKDIR"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILDROOT }}
          path: ${{ env.BUILDROOT }}


